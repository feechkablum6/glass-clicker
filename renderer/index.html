<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
    <title>Кликер</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="pane" id="pane">
        <header class="titlebar" id="titlebar">
            <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12h2"></path>
                    <path d="M12 4v2"></path>
                    <path d="M6.3 6.3l1.5 1.5"></path>
                    <path d="M17.7 6.3l-1.5 1.5"></path>
                    <path d="M6.3 17.7l1.5-1.5"></path>
                    <path d="M12 12l8.5 2.9-3.8 1.8-1.8 3.8z"></path>
                </svg>
            </span>
            <h1 class="title">Кликер</h1>
            <div class="window-actions">
                <button class="icon-button" id="minimize" type="button" title="Свернуть" aria-label="Свернуть окно">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <path d="M4 8.5h8"></path>
                    </svg>
                </button>
                <button class="icon-button danger" id="close" type="button" title="Свернуть в трей" aria-label="Свернуть кликер в трей">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"></path>
                    </svg>
                </button>
            </div>
        </header>

        <section class="stage">
            <button class="power" id="power" type="button" aria-pressed="false">
                <span class="power-glow" aria-hidden="true"></span>
                <span class="power-face">
                    <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path class="spark spark-a" d="M3.6 12h2.3"></path>
                        <path class="spark spark-b" d="M12 3.6v2.3"></path>
                        <path class="spark spark-a" d="M6.1 6.1l1.6 1.6"></path>
                        <path class="spark spark-b" d="M17.9 6.1l-1.6 1.6"></path>
                        <path class="spark spark-a" d="M6.1 17.9l1.6-1.6"></path>
                        <path d="M12 12l8.8 3-3.9 1.9-1.9 3.9z"></path>
                    </svg>
                </span>
            </button>
            <p class="stage-status" id="status" role="status">Выключен</p>
            <p class="stage-hint" id="hint">Колесо мыши включает и выключает</p>
        </section>

        <section class="control">
            <div class="control-head">
                <h2 class="control-title">Скорость</h2>
                <p class="readout"><span id="cps-value">12</span><span class="readout-unit">кл/с</span></p>
            </div>
            <input class="slider" id="cps" type="range" min="1" max="100" step="1" value="12"
                   aria-label="Кликов в секунду">
            <div class="slider-scale" aria-hidden="true">
                <span style="--at: 0">1</span>
                <span style="--at: 0.2424">25</span>
                <span style="--at: 0.4949">50</span>
                <span style="--at: 1">100</span>
            </div>
            <p class="control-note" id="interval-note">Пауза между кликами 83 мс</p>
        </section>

        <div class="control-pair">
            <section class="control">
                <h2 class="control-title">Кнопка</h2>
                <div class="segment" id="button-segment" role="group" aria-label="Какой кнопкой кликать">
                    <span class="segment-thumb" aria-hidden="true"></span>
                    <button type="button" data-value="left" aria-pressed="true">Левая</button>
                    <button type="button" data-value="right" aria-pressed="false">Правая</button>
                </div>
            </section>

            <section class="control">
                <h2 class="control-title">Режим</h2>
                <div class="segment" id="mode-segment" role="group" aria-label="Как работает горячая клавиша">
                    <span class="segment-thumb" aria-hidden="true"></span>
                    <button type="button" data-value="toggle" aria-pressed="true">Вкл/выкл</button>
                    <button type="button" data-value="hold" aria-pressed="false">Удержание</button>
                </div>
            </section>
        </div>

        <section class="control">
            <h2 class="control-title">Горячая клавиша</h2>
            <button class="bind" id="bind" type="button">
                <span class="bind-name" id="bind-name">Колесо мыши</span>
                <span class="bind-action" id="bind-action">Изменить</span>
            </button>
            <p class="control-note" id="bind-note">Escape останавливает кликер из любого приложения</p>
        </section>

        <footer class="footer">
            <p class="counter">Кликов <span id="clicks">0</span></p>
            <button class="text-button" id="reset" type="button">Сбросить счёт</button>
        </footer>
    </main>

    <script src="renderer.js"></script>
</body>
</html>
